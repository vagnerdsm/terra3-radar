name: Atualizar radar.json

on:
  push:
    paths:
      - 'data/raw/**'
      - 'pipeline/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python pipeline/build_data.py
      - run: node app/scripts/sync-data.mjs
      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed app/public/radar.json
          git diff --cached --quiet || git commit -m "chore(dados): regenerar radar.json a partir da planilha"
          git push
